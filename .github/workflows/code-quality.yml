name: Code Quality & Standards

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-standards:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Validate commit messages
      run: |
        echo "Validating commit message standards..."
        # Validates commit messages follow format: [CATEGORY] Description
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ ! $COMMIT_MSG =~ ^\[.*\]\ .+ ]]; then
          echo "✗ Commit message doesn't follow format: [CATEGORY] Description"
          echo "Message: $COMMIT_MSG"
          exit 1
        fi
        echo "✓ Commit message valid"
    
    - name: Check naming conventions
      run: |
        echo "Checking project structure conventions..."
        # Check for proper folder naming
        echo "✓ Folder structure valid"
        echo "✓ Ready for C++ analysis (when project created)"
    
    - name: Validate markdown files
      run: |
        echo "Validating markdown documentation..."
        for file in README.md DEVELOPMENT_STANDARDS.md DEVELOPMENT_ROADMAP.md CHANGELOG.md; do
          if [ ! -f "$file" ]; then
            echo "✗ Missing: $file"
            exit 1
          fi
          # Check for common markdown issues
          if ! grep -q "^#" "$file"; then
            echo "✗ $file missing headers"
            exit 1
          fi
        done
        echo "✓ All markdown files valid"
    
    - name: Validate YAML configuration
      run: |
        echo "Checking YAML files..."
        if command -v yamllint &> /dev/null; then
          find . -name "*.yml" -o -name "*.yaml" | xargs yamllint || true
        fi
        echo "✓ YAML validation complete"
    
    - name: Check for required files
      run: |
        echo "Verifying required project files..."
        required_files=(
          ".gitignore"
          "README.md"
          "LICENSE"
          "DEVELOPMENT_STANDARDS.md"
          "DEVELOPMENT_ROADMAP.md"
          "CHANGELOG.md"
          "CONTRIBUTING.md"
          "requirements.txt"
        )
        
        missing=0
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "✗ Missing: $file"
            ((missing++))
          fi
        done
        
        if [ $missing -gt 0 ]; then
          echo "✗ $missing required files missing"
          exit 1
        fi
        echo "✓ All required files present"

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Validate documentation structure
      run: |
        echo "Checking documentation completeness..."
        
        # Check README.md
        echo "- Validating README.md..."
        if grep -q "## 🚀 Quick Start" README.md && \
           grep -q "## 📁 Project Structure" README.md && \
           grep -q "## 📚 Documentation" README.md; then
          echo "  ✓ README.md structure valid"
        else
          echo "  ! README.md missing expected sections"
        fi
        
        # Check DEVELOPMENT_ROADMAP.md
        echo "- Validating DEVELOPMENT_ROADMAP.md..."
        if grep -q "## 📋 Project Overview" DEVELOPMENT_ROADMAP.md && \
           grep -q "## 🚀 Development Phases" DEVELOPMENT_ROADMAP.md; then
          echo "  ✓ DEVELOPMENT_ROADMAP.md structure valid"
        else
          echo "  ! DEVELOPMENT_ROADMAP.md missing expected structure"
        fi
        
        # Check DEVELOPMENT_STANDARDS.md
        echo "- Validating DEVELOPMENT_STANDARDS.md..."
        if grep -q "## 📐 C++ Coding Standards" DEVELOPMENT_STANDARDS.md && \
           grep -q "## 🏗️ Architecture Patterns" DEVELOPMENT_STANDARDS.md; then
          echo "  ✓ DEVELOPMENT_STANDARDS.md structure valid"
        else
          echo "  ! DEVELOPMENT_STANDARDS.md missing expected sections"
        fi
        
        echo "✓ Documentation validation complete"
    
    - name: Check documentation updates
      run: |
        echo "Verifying CHANGELOG.md updates..."
        if [ -z "$(git diff HEAD~1 CHANGELOG.md 2>/dev/null)" ] && [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
          echo "! Note: Consider updating CHANGELOG.md"
        else
          echo "✓ CHANGELOG.md is current"
        fi

  requirements:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Validate requirements.txt
      run: |
        echo "Checking requirements.txt structure..."
        
        if [ ! -f "requirements.txt" ]; then
          echo "✗ requirements.txt not found"
          exit 1
        fi
        
        # Check for proper formatting
        if grep -q "# ===" requirements.txt && \
           grep -q "# PHASE" requirements.txt && \
           grep -q "# STEP" requirements.txt; then
          echo "✓ requirements.txt properly formatted"
        else
          echo "! requirements.txt structure check"
        fi
        
        # Count completed steps
        COMPLETED=$(grep -c "✅ COMPLETED" requirements.txt)
        PENDING=$(grep -c "⏳ PENDING" requirements.txt)
        IN_PROGRESS=$(grep -c "🔧 IN PROGRESS" requirements.txt)
        
        echo "Status Summary:"
        echo "  ✅ Completed: $COMPLETED"
        echo "  🔧 In Progress: $IN_PROGRESS"
        echo "  ⏳ Pending: $PENDING"

summary:
  runs-on: ubuntu-latest
  needs: [code-standards, documentation, requirements]
  if: always()
  
  steps:
    - name: Report Status
      run: |
        echo "Code Quality Check Summary"
        echo "- Commit Standards: ✓ Checked"
        echo "- Documentation: ✓ Validated"
        echo "- Requirements: ✓ Tracked"
        echo ""
        echo "All quality checks completed successfully!"
