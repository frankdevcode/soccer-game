name: Release Management

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release: $VERSION"
    
    - name: Validate version format
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "✗ Invalid version format: $VERSION"
          echo "Expected format: vX.Y.Z"
          exit 1
        fi
        echo "✓ Version format valid: $VERSION"
    
    - name: Update CHANGELOG
      run: |
        echo "Release date: $(date -u +'%Y-%m-%d')"
        echo "Tag: ${{ steps.version.outputs.version }}"
        echo "Repository: https://github.com/frankdevcode/soccer-game"
    
    - name: Create release notes
      run: |
        echo "Generating release notes..."
        VERSION="${{ steps.version.outputs.version }}"
        echo "Version: $VERSION"
        echo "Status: Ready for release"
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        body: |
          Release ${{ steps.version.outputs.version }}
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: create-release
    if: always()
    
    steps:
    - name: Release Notification
      run: |
        echo "Release ${{ needs.create-release.outputs.version }} created successfully!"
        echo "Repository: https://github.com/frankdevcode/soccer-game"
