version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: soccer-game-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: soccer-game
    volumes:
      - mongodb_data:/data/db
    networks:
      - soccer-game-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: soccer-game-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/soccer-game
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-in-production}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - soccer-game-network
    healthcheck:
      test: curl -f http://localhost:3001/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Web Application
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        VITE_WEBSOCKET_URL: ws://localhost:3001
        VITE_STREAM_URL: http://localhost:8015
    container_name: soccer-game-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - soccer-game-network
    healthcheck:
      test: curl -f http://localhost:80 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional)
  redis:
    image: redis:7.0-alpine
    container_name: soccer-game-cache
    ports:
      - "6379:6379"
    networks:
      - soccer-game-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

networks:
  soccer-game-network:
    driver: bridge
